name: Refresh GitHub snapshot

# Fetches fresh activity and public-project snapshots, checks the site still
# matches them, and queues a pull request with the change in Mergepatrol,
# which merges it once CI passes. The merge triggers the Cloudflare deploy.
#
# main requires signed commits, a pull request and the CI check, so the
# snapshot commit goes through the GitHub API (which signs it). GH_PAT is a token with `repo` scope: it reads commits in
# private repos and, unlike GITHUB_TOKEN, opens pull requests that trigger CI.
#
# When the sync check fails, the job opens or updates one "Site out of sync"
# issue with the list of fixes instead.

on:
  schedule:
    - cron: '30 6 * * *'   # daily, 06:30 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch-github-data.ts'
      - 'scripts/fetch-open-source.ts'
      - 'scripts/github-fetch.ts'
      - '.github/workflows/refresh-github-stats.yml'

concurrency:
  group: refresh-github-snapshot
  cancel-in-progress: false

permissions: {}

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
      BRANCH: data/refresh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Fetch fresh snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_USERNAME: cjber
        run: |
          npm run fetch-data
          npm run fetch-open-source

      - name: Check the site matches the snapshot
        id: sync
        run: |
          set -o pipefail
          npm run -s check-sync | tee sync.txt

      - name: Report drift
        if: failure() && steps.sync.outcome == 'failure'
        run: |
          {
            echo 'The daily refresh found parts of the site that no longer match GitHub. Fix these, then rerun the "Refresh GitHub snapshot" workflow:'
            echo
            cat sync.txt
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > issue.md
          number=$(gh issue list --state open --search 'in:title "Site out of sync"' --json number -q '.[0].number')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file issue.md
          else
            gh issue create --title 'Site out of sync' --body-file issue.md
          fi

      - name: Close the drift issue
        run: |
          number=$(gh issue list --state open --search 'in:title "Site out of sync"' --json number -q '.[0].number')
          [ -z "$number" ] || gh issue close "$number" --comment "In sync again as of $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."

      - name: Commit the snapshot to a branch
        id: commit
        run: |
          set -o pipefail
          if git diff --quiet -- lib/github-data.json lib/open-source.json; then
            echo "no snapshot changes"
            exit 0
          fi
          head=$(git rev-parse HEAD)
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" -f sha="$head" -F force=true >/dev/null \
            || gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$head" >/dev/null
          # The activity snapshot is too large for a command-line argument.
          base64 -w0 lib/github-data.json > "$RUNNER_TEMP/activity.b64"
          base64 -w0 lib/open-source.json > "$RUNNER_TEMP/projects.b64"
          jq -n \
            --arg repo "$GITHUB_REPOSITORY" --arg branch "$BRANCH" --arg head "$head" \
            --arg headline "data: refresh GitHub snapshot ($(date -u +%Y-%m-%d))" \
            --rawfile activity "$RUNNER_TEMP/activity.b64" \
            --rawfile projects "$RUNNER_TEMP/projects.b64" \
            '{query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                expectedHeadOid: $head,
                message: {headline: $headline},
                fileChanges: {additions: [
                  {path: "lib/github-data.json", contents: $activity},
                  {path: "lib/open-source.json", contents: $projects}]}}}}' \
            | gh api graphql --input - >/dev/null
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Queue the pull request
        if: steps.commit.outputs.changed == 'true'
        run: |
          gh pr view "$BRANCH" --json state -q .state 2>/dev/null | grep -qx OPEN \
            || gh pr create --head "$BRANCH" --title 'data: refresh GitHub snapshot' \
                 --body 'Daily snapshot refresh from the "Refresh GitHub snapshot" workflow.'
          gh pr edit "$BRANCH" --add-label mergepatrol
