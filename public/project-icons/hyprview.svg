<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <title>hyprview</title>
  <rect width="200" height="200" rx="24" fill="#121113"/>
  <!-- 2x2 grid of "windows" with one focused; mirrors the overview layout -->
  <g stroke="#333333" stroke-width="2">
    <!-- focused (primary) -->
    <rect x="32" y="32"  width="60" height="60" rx="10" fill="#1a1a1c" stroke="#e78a53" stroke-width="3"/>
    <!-- siblings (surface_alt) -->
    <rect x="108" y="32"  width="60" height="60" rx="10" fill="#1a1a1c"/>
    <rect x="32"  y="108" width="60" height="60" rx="10" fill="#1a1a1c"/>
    <rect x="108" y="108" width="60" height="60" rx="10" fill="#1a1a1c"/>
  </g>
  <!-- inner content stripes to suggest window contents -->
  <g fill="#222222">
    <rect x="40"  y="44"  width="44" height="6" rx="2"/>
    <rect x="40"  y="56"  width="32" height="6" rx="2"/>
    <rect x="40"  y="68"  width="40" height="6" rx="2"/>

    <rect x="116" y="44"  width="44" height="6" rx="2"/>
    <rect x="116" y="56"  width="28" height="6" rx="2"/>

    <rect x="40"  y="120" width="36" height="6" rx="2"/>
    <rect x="40"  y="132" width="44" height="6" rx="2"/>

    <rect x="116" y="120" width="44" height="6" rx="2"/>
    <rect x="116" y="132" width="36" height="6" rx="2"/>
    <rect x="116" y="144" width="40" height="6" rx="2"/>
  </g>
</svg>
